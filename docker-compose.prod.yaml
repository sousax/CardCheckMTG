services:
  web:
    container_name: '${COMPOSE_PROJECT_NAME}_web'
    restart: always
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file:
      - apps/web/.env
    networks:
      - sail
    environment:
      HOST: web
      NODE_ENV: production
      DB_HOST: pgsql

  # Caddy issues and renews the Let's Encrypt cert itself; the session cookie is secure in production, so HTTPS is mandatory.
  proxy:
    container_name: '${COMPOSE_PROJECT_NAME}_proxy'
    restart: always
    image: caddy:2
    command: caddy reverse-proxy --from ${APP_DOMAIN?:err} --to web:3333
    volumes:
      - caddy:/data
    networks:
      - sail
    ports:
      - 80:80
      - 443:443

  pgsql:
    ports: []
    restart: always

volumes:
  caddy: