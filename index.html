<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MTG CardList — checklist de deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* Design system "Galeria" (MTG CardList). Dark default, light via [data-theme="light"] */
  :root{
    --red:#ef4444; --orange:#fb923c; --amber:#fde68a;
    --cream:#fff8ec; --ember:#170505;
    --bg:#160606; --surface:#230b0a; --surface-hover:#2e100e;
    --ink:#fdf0dc; --ink-dim:#c9a48c; --edge:#fdf0dc;

    --font-display:'Pirata One', serif;
    --font-body:'Space Grotesk', sans-serif;
    --font-mono:'JetBrains Mono', monospace;

    --page-x:40px;
    --border:2px; --border-thick:3px;
    --shadow-sm:3px 3px 0 var(--edge);
    --shadow-md:6px 6px 0 var(--edge);
    --shadow-lg:8px 8px 0 var(--red);
    --shadow-hover:9px 9px 0 var(--red);
    --shadow-row-hover:4px 4px 0 var(--red);
    --ease:.12s ease;
  }
  [data-theme="light"]{
    --red:#e0301e; --orange:#f28a1e; --amber:#fcd34d;
    --bg:#f6ecdb; --surface:#fff8ec; --surface-hover:#fdf0dc;
    --ink:#170505; --ink-dim:#6e4a3a; --edge:#170505;
  }
  @media (max-width:640px){ :root{ --page-x:16px; } }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg); color:var(--ink); font-family:var(--font-body); min-height:100vh; transition:background-color var(--ease);}
  textarea::placeholder,input::placeholder{color:var(--ink-dim); opacity:.7;}
  button{font-family:var(--font-body); font-weight:700; font-size:13px; border-radius:0; cursor:pointer;}

  /* header band */
  header.band{
    display:flex; align-items:center; gap:32px; flex-wrap:wrap;
    background:var(--red); color:var(--cream);
    padding:16px var(--page-x); border-bottom:var(--border-thick) solid var(--edge);
  }
  .wordmark{font-family:var(--font-display); font-size:40px; line-height:1; white-space:nowrap;}
  .wordmark span{color:var(--amber);}
  .tabs{flex:1; display:flex; gap:8px; flex-wrap:wrap; min-width:0;}
  .tab{
    border:var(--border) solid transparent; background:transparent; color:var(--cream);
    padding:7px 12px; white-space:nowrap; display:inline-flex; align-items:center; gap:8px;
  }
  .tab:hover{background:rgba(23,5,5,.18);}
  .tab.active{background:var(--cream); color:var(--ember); border-color:var(--ember); box-shadow:3px 3px 0 var(--ember);}
  .tab.dashed{border:var(--border) dashed rgba(255,248,236,.7);}
  .tab .del{font-weight:500; opacity:.55;}
  .tab .del:hover{opacity:1; color:var(--red);}
  .theme-btn{background:transparent; color:var(--cream); border:var(--border) solid var(--cream); font-size:12px; padding:7px 12px; white-space:nowrap;}
  @media (max-width:760px){
    header.band{gap:14px; justify-content:space-between;}
    .tabs{order:1; flex-basis:100%;}
  }

  .wrap{max-width:1280px; margin:0 auto; padding:28px var(--page-x) 80px;}

  /* controls */
  .btn{
    border:var(--border) solid var(--edge); padding:9px 14px;
    background:var(--red); color:var(--cream);
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    transition:transform var(--ease), box-shadow var(--ease);
  }
  .btn.outline{background:var(--surface); color:var(--ink);}
  .btn:hover{transform:translate(-2px,-2px); box-shadow:var(--shadow-sm);}
  .btn:active{transform:none; box-shadow:none;}
  .input, textarea{
    width:100%; background:var(--surface); border:var(--border) solid var(--edge); border-radius:0;
    color:var(--ink); font-family:var(--font-body); font-size:14px; padding:10px 14px; outline:none;
    transition:box-shadow var(--ease);
  }
  textarea{min-height:200px; resize:vertical; font-family:var(--font-mono); font-size:12.5px; padding:12px; line-height:1.5;}
  .input:focus, textarea:focus{box-shadow:var(--shadow-sm);}
  .seg{display:flex;}
  .seg button{border:var(--border) solid var(--edge); background:var(--surface); color:var(--ink); padding:9px 14px; transition:box-shadow var(--ease);}
  .seg button + button{border-left-width:0;}
  .seg button.on{background:var(--ink); color:var(--bg);}
  .seg.chips{gap:6px;}
  .seg.chips button + button{border-left-width:var(--border);}
  .seg.chips button.on{background:var(--amber); color:var(--ember); box-shadow:var(--shadow-sm);}
  .status{display:inline-block; font-weight:700; font-size:12px; padding:5px 9px; line-height:1.4; min-height:26px;}
  .status:empty{padding:0;}
  .status.err{background:var(--red); color:var(--cream);}
  .status.ok{background:var(--amber); color:var(--ember);}

  /* hero */
  .hero{display:grid; grid-template-columns:minmax(0,1fr) minmax(220px,360px); gap:36px; align-items:center;}
  @media (max-width:760px){ .hero{grid-template-columns:1fr;} }
  .eyebrow{display:inline-block; font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; background:var(--amber); color:var(--ember); padding:5px 9px;}
  .hero h1{font-family:var(--font-display); font-weight:400; font-size:clamp(52px,9vw,92px); line-height:.9; margin:14px 0 20px; text-wrap:balance; overflow-wrap:anywhere;}
  .art{height:190px; background:center 25%/cover no-repeat var(--surface); border:var(--border-thick) solid var(--edge); box-shadow:var(--shadow-lg);}
  .stats{display:flex; border:var(--border-thick) solid var(--edge); box-shadow:var(--shadow-md); width:max-content; max-width:100%;}
  .stats > div{padding:10px 22px; display:flex; flex-direction:column; background:var(--surface);}
  .stats > div + div{border-left:var(--border-thick) solid var(--edge);}
  .stats > div.accent{background:var(--orange); color:var(--ember);}
  .stats b{font-size:30px; line-height:1;}
  .stats span{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; opacity:.8; margin-top:4px;}
  @media (max-width:480px){ .stats > div{padding:10px 12px;} .stats b{font-size:24px;} }

  .toolbar{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:36px 0 6px;}
  .toolbar .input{flex:1 1 220px; width:auto;}

  /* sections */
  .cat-head{display:flex; align-items:baseline; gap:14px; padding:28px 0 10px;}
  .cat-head .t{font-family:var(--font-display); font-size:30px; line-height:1;}
  .cat-head .rule{flex:1; border-top:var(--border) solid var(--edge); align-self:center; opacity:.25;}
  .cat-head .n{font-weight:700; font-size:12px; padding:3px 8px; border:var(--border) solid var(--edge);}

  .rows{display:flex; flex-direction:column; gap:8px;}
  .row{
    display:flex; align-items:center; gap:16px; padding:8px 14px 8px 8px;
    border:var(--border) solid var(--edge); background:var(--surface);
    font-size:16px; font-weight:700; transition:transform var(--ease), box-shadow var(--ease);
  }
  .row:hover{transform:translate(-2px,-2px); box-shadow:var(--shadow-row-hover);}
  .thumb{flex:0 0 auto; width:36px; height:36px; border:var(--border) solid var(--edge); background:center 22%/240% no-repeat var(--bg);}
  .qty{flex:0 0 44px; color:var(--red); font-size:18px;}
  .name{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .row.owned .name{color:var(--ink-dim);}
  .row.not-found .name{color:var(--red);}
  .cat-select{
    flex:0 0 130px; appearance:none; background:transparent; border:var(--border) solid transparent; border-radius:0;
    color:var(--ink-dim); font-family:var(--font-body); font-size:12px; font-weight:500;
    text-transform:uppercase; letter-spacing:.06em; padding:4px 6px; cursor:pointer;
  }
  .cat-select:hover,.cat-select:focus{border-color:var(--edge); outline:none;}
  .cat-select option{background:var(--surface); color:var(--ink);}
  .pill{flex:0 0 92px; text-align:center; font-size:11px; letter-spacing:.1em; text-transform:uppercase; padding:5px 9px; background:var(--red); color:var(--cream);}
  .owned .pill{background:var(--amber); color:var(--ember);}
  @media (max-width:640px){ .cat-select,.thumb{display:none;} .row{gap:10px;} .qty{flex-basis:34px;} .pill{flex-basis:auto;} }

  .check{
    flex:0 0 auto; width:24px; height:24px; border:var(--border) solid var(--edge); background:var(--bg);
    color:var(--ember); display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition:background-color var(--ease);
  }
  .check svg{width:12px; height:12px; opacity:0;}
  .check.on{background:var(--amber);}
  .check.on svg{opacity:1;}

  .tiles{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:28px; padding-top:6px;}
  @media (max-width:480px){ .tiles{grid-template-columns:repeat(2,1fr); gap:14px;} }
  .tile{position:relative; border:var(--border-thick) solid var(--edge); background:var(--surface); box-shadow:var(--shadow-md); transition:transform var(--ease), box-shadow var(--ease);}
  .tile:hover{transform:translate(-3px,-3px); box-shadow:var(--shadow-hover);}
  .tile img, .tile .nf{width:100%; aspect-ratio:5/7; object-fit:cover; display:block; border-bottom:var(--border-thick) solid var(--edge);}
  .tile.owned img{opacity:.6;}
  .tile .nf{display:flex; align-items:center; justify-content:center; text-align:center; padding:16px; color:var(--ink-dim); font-size:12px;}
  .tile .check{position:absolute; top:10px; left:10px;}
  .tile .badge{position:absolute; top:10px; right:10px; background:var(--red); color:var(--cream); font-weight:700; font-size:14px; padding:3px 8px; border:var(--border) solid var(--edge);}
  .tile .foot{display:flex; justify-content:space-between; align-items:center; gap:8px; padding:10px 12px; font-size:14px; font-weight:700;}
  .tile .foot .name{flex:1;}
  .tile .pill{flex:0 0 auto; font-size:10px; padding:4px 7px;}

  /* empty state */
  .empty{display:flex; align-items:center; gap:36px; padding:36px; border:var(--border-thick) dashed var(--edge); background:var(--surface); color:var(--ink-dim); font-size:15px; line-height:1.5;}
  .empty .art{flex:0 0 180px; height:180px;}
  .empty .body{display:flex; flex-direction:column; gap:12px; align-items:flex-start;}
  .empty .title{font-family:var(--font-display); font-size:36px; line-height:1; color:var(--red);}
  @media (max-width:640px){ .empty{flex-direction:column; align-items:stretch; padding:22px; gap:22px;} .empty .art{flex-basis:auto;} }

  /* import dialog */
  .scrim{position:fixed; inset:0; background:rgba(23,5,5,.6); display:flex; align-items:center; justify-content:center; z-index:40; padding:20px;}
  .scrim[hidden]{display:none;}
  .panel{width:min(520px,100%); background:var(--surface); border:var(--border-thick) solid var(--edge); box-shadow:var(--shadow-md); padding:22px; display:flex; flex-direction:column; gap:12px;}
  .panel h2{font-family:var(--font-display); font-weight:400; font-size:28px; line-height:1; margin:0 0 4px;}
  .panel .actions{display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap;}
  .hint{font-size:12px; color:var(--ink-dim);}

  /* hover preview */
  #preview{
    position:fixed; z-index:50; width:240px; pointer-events:none; opacity:0; transform:scale(.96);
    transition:opacity var(--ease), transform var(--ease);
    border:var(--border-thick) solid var(--edge); box-shadow:var(--shadow-lg); background:var(--surface);
  }
  #preview.show{opacity:1; transform:none;}
  #preview img{width:100%; display:block;}
  #preview .pv-fallback{display:none; aspect-ratio:5/7; align-items:center; justify-content:center; text-align:center; color:var(--ink-dim); font-weight:700; font-size:12px; padding:16px;}
  #preview.notfound .pv-fallback{display:flex;}
  #preview.notfound img{display:none;}

  @media (prefers-reduced-motion:reduce){ *{transition:none !important;} }
</style>
</head>
<body>

<header class="band">
  <div class="wordmark">MTG <span>CardList</span></div>
  <nav class="tabs" id="tabs"></nav>
  <button class="theme-btn" id="themeBtn" type="button">Modo claro</button>
</header>

<main class="wrap" id="main"></main>

<div class="scrim" id="dialog" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
    <h2 id="dlgTitle">Importar lista</h2>
    <textarea id="decklistInput" placeholder="4 Lightning Bolt&#10;1 Sol Ring&#10;23 Island&#10;...&#10;&#10;(aceita &quot;4x Nome&quot;, código de set entre parênteses, etc — eu ignoro o resto)"></textarea>
    <input type="text" class="input" id="deckTitle" placeholder="nome do deck (opcional)">
    <div><div class="status" id="status"></div></div>
    <div class="actions">
      <button class="btn outline" id="cancelBtn" type="button">Cancelar</button>
      <button class="btn" id="importBtn" type="button">Importar e buscar cartas</button>
    </div>
    <div class="hint">As imagens e dados vêm da Scryfall. Decks grandes podem levar alguns segundos.</div>
  </div>
</div>

<div id="preview"><img id="previewImg" src="" alt=""><div class="pv-fallback">carta não encontrada na Scryfall</div></div>

<script>
(function(){
  const STORAGE_KEY_INDEX = 'decks-index';
  // window.storage existe no sandbox do artifact; fora dele (GitHub Pages) cai pro localStorage.
  const store = window.storage || {
    get: async k => { const v = localStorage.getItem(k); return v == null ? null : { value: v }; },
    set: async (k, v) => localStorage.setItem(k, v),
    delete: async k => localStorage.removeItem(k)
  };
  const pref = {
    get(k, d){ try{ return localStorage.getItem(k) || d; }catch(e){ return d; } },
    set(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
  };

  let deckIndex = [];
  let currentDeckId = null;
  let currentDeck = null; // { id, name, cards: [{name, qty, owned, image, notFound, category}] }
  let filter = 'all';
  let query = '';
  let view = pref.get('cardlist-view', 'grid');
  let theme = pref.get('cardlist-theme', 'dark');

  const el = id => document.getElementById(id);
  const main = el('main');
  const tabsEl = el('tabs');
  const dialog = el('dialog');
  const decklistInput = el('decklistInput');
  const deckTitle = el('deckTitle');
  const statusEl = el('status');
  const preview = el('preview');
  const previewImg = el('previewImg');

  const CATEGORY_ORDER = ['Criaturas', 'Planeswalkers', 'Artefatos', 'Encantamentos', 'Instantâneos', 'Feitiços', 'Terrenos', 'Outros'];
  const BASIC_LANDS = ['plains','island','swamp','mountain','forest','wastes'];
  const CHARACTERS = ['Gideon, Ally of Zendikar', 'Chandra, Torch of Defiance', 'Jace, the Mind Sculptor', 'Liliana of the Veil', 'Nissa, Who Shakes the World'];
  const CHECK_SVG = '<svg viewBox="0 0 12 12" fill="none"><path d="M2 6.5L4.7 9L10 3" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  // Tabela manual de categorias para cartas já conhecidas (a Scryfall bloqueia
  // chamadas automatizadas de API por proteção anti-bot, então isso é feito
  // a partir do conhecimento de cartas do Magic em vez de uma busca ao vivo).
  // Edite/expanda esse objeto à vontade, ou use o seletor de categoria em cada linha.
  const KNOWN_CATEGORIES = {
    'kaito, dancing shadow':'Planeswalkers','wingcrafter':'Criaturas','command tower':'Terrenos',
    'path of ancestry':'Terrenos','waterfront district':'Terrenos','ornithopter':'Criaturas',
    "rogue's passage":'Terrenos','jwar isle refuge':'Terrenos','dismal backwater':'Terrenos',
    'access tunnel':'Terrenos',"wayfarer's bauble":'Artefatos','siren stormtamer':'Criaturas',
    'aqueous form':'Encantamentos','gingerbrute':'Criaturas','slither blade':'Criaturas',
    'spectral sailor':'Criaturas','mothdust changeling':'Criaturas','changeling outcast':'Criaturas',
    'signal pest':'Criaturas','faerie dreamthief':'Criaturas','thousand-faced shadow':'Criaturas',
    'faerie seer':'Criaturas','lazotep plating':'Instantâneos','sage owl':'Criaturas',
    'spire owl':'Criaturas','augury owl':'Criaturas','saiba cryptomancer':'Criaturas',
    'sky diamond':'Artefatos','charcoal diamond':'Artefatos','jwari disruption':'Feitiços',
    'telling time':'Feitiços','cunning evasion':'Instantâneos','moon-circuit hacker':'Criaturas',
    'skullsnatcher':'Criaturas','prismatic lens':'Artefatos','smoke shroud':'Instantâneos',
    'silver-fur master':'Criaturas','amoeboid changeling':'Criaturas','ebony fly':'Criaturas',
    'ornithopter of paradise':'Criaturas','nightveil sprite':'Criaturas','dokuchi silencer':'Criaturas',
    'tetsuko umezawa, fugitive':'Criaturas','arcane adaptation':'Encantamentos',
    'grazilaxx, illithid scholar':'Criaturas','prosperous thief':'Criaturas','biting-palm ninja':'Criaturas',
    'satoru umezawa':'Criaturas','mistblade shinobi':'Criaturas',"yuriko, the tiger's shadow":'Criaturas',
    'moonsnare specialist':'Criaturas','aetherize':'Instantâneos','ingenious infiltrator':'Criaturas',
    'consuming tide':'Feitiços','reconnaissance mission':'Instantâneos','azra smokeshaper':'Criaturas',
    'ninja of the deep hours':'Criaturas','far':'Instantâneos','okiba-gang shinobi':'Criaturas',
    'xenograft':'Encantamentos',"curtains' call":'Instantâneos','discovery':'Feitiços',
    'sapphire dragon':'Criaturas','consign':'Feitiços','never':'Feitiços','treasure cruise':'Feitiços',
    'spite':'Instantâneos','dig through time':'Instantâneos','connive':'Feitiços','commit':'Instantâneos',
    'rags':'Feitiços','shadow of mortality':'Feitiços'
  };

  function categorize(name){
    const key = name.toLowerCase().trim();
    if(BASIC_LANDS.includes(key)) return 'Terrenos';
    if(KNOWN_CATEGORIES[key]) return KNOWN_CATEGORIES[key];
    return 'Outros';
  }

  function parseDecklist(text){
    const lines = text.split('\n');
    const entries = [];
    for(let raw of lines){
      let line = raw.trim();
      if(!line) continue;
      if(/^(deck|sideboard|maybeboard|commander)s?:?$/i.test(line)) continue;
      if(line.startsWith('//') || line.startsWith('#')) continue;
      const m = line.match(/^(\d+)\s*x?\s+(.+)$/i);
      if(!m) continue;
      let qty = parseInt(m[1], 10);
      let name = m[2];
      // strip set code / collector number e.g. "(STA) 42" or "(stx)"
      name = name.replace(/\s*\([A-Za-z0-9]{2,6}\)\s*[\w\-★]*\s*$/,'');
      // strip trailing foil markers
      name = name.replace(/\s*\*F\*\s*$/i,'').trim();
      // double-faced cards: keep front face for lookup
      if(name.includes('//')) name = name.split('//')[0].trim();
      if(!name) continue;
      entries.push({ name, qty });
    }
    // merge duplicates
    const map = new Map();
    for(const e of entries){
      const key = e.name.toLowerCase();
      if(map.has(key)) map.get(key).qty += e.qty;
      else map.set(key, { name: e.name, qty: e.qty });
    }
    return Array.from(map.values());
  }

  // Imagem vem direto de uma tag <img>, sem fetch() — assim não esbarra no
  // bloqueio de rede do sandbox do artifact. A Scryfall resolve o nome
  // (com fuzzy match) e devolve a imagem direto.
  function scryfallImageUrl(name, version){
    return 'https://api.scryfall.com/cards/named?format=image&version=' + (version || 'normal') + '&fuzzy=' + encodeURIComponent(name);
  }

  function h(tag, cls, text){
    const n = document.createElement(tag);
    if(cls) n.className = cls;
    if(text != null) n.textContent = text;
    return n;
  }

  function setStatus(msg, type){
    statusEl.textContent = msg || '';
    statusEl.className = 'status' + (type ? ' '+type : '');
  }

  function applyTheme(){
    document.documentElement.dataset.theme = theme;
    el('themeBtn').textContent = theme === 'dark' ? 'Modo claro' : 'Modo escuro';
  }

  function openDialog(){
    setStatus('');
    dialog.hidden = false;
    decklistInput.focus();
  }
  function closeDialog(){ dialog.hidden = true; }

  function importDeck(){
    const entries = parseDecklist(decklistInput.value);
    if(entries.length === 0){
      setStatus('Não encontrei nenhuma carta reconhecível. Use o formato "4 Nome da Carta".', 'err');
      return;
    }
    const cards = entries.map(e => ({
      name: e.name,
      qty: e.qty,
      owned: false,
      image: scryfallImageUrl(e.name),
      notFound: false,
      category: categorize(e.name)
    }));
    const id = 'deck_' + Date.now();
    const name = deckTitle.value.trim() || 'Deck sem nome';
    currentDeck = { id, name, cards };
    currentDeckId = id;
    pref.set('cardlist-current', id);

    saveCurrentDeck();
    if(!deckIndex.find(d => d.id === id)) deckIndex.push({ id, name });
    renderTabs();
    renderDeck();

    decklistInput.value = '';
    deckTitle.value = '';
    closeDialog();
  }

  async function saveCurrentDeck(){
    if(!currentDeck) return;
    try{
      await store.set('deck:'+currentDeck.id, JSON.stringify(currentDeck), false);
      const index = await loadDeckIndex();
      if(!index.find(d => d.id === currentDeck.id)){
        index.push({ id: currentDeck.id, name: currentDeck.name });
        await store.set(STORAGE_KEY_INDEX, JSON.stringify(index), false);
      }
    }catch(e){ console.error('storage save failed', e); }
  }

  async function loadDeckIndex(){
    try{
      const r = await store.get(STORAGE_KEY_INDEX, false);
      return r ? JSON.parse(r.value) : [];
    }catch(e){ return []; }
  }

  function renderTabs(){
    tabsEl.innerHTML = '';
    for(const d of deckIndex){
      const tab = h('button', 'tab' + (d.id === currentDeckId ? ' active' : ''), d.name);
      tab.type = 'button';
      const del = h('span', 'del', '×');
      del.title = 'remover';
      del.addEventListener('click', ev => { ev.stopPropagation(); deleteDeck(d.id); });
      tab.appendChild(del);
      tab.addEventListener('click', () => loadDeck(d.id));
      tabsEl.appendChild(tab);
    }
    const add = h('button', 'tab dashed', '+ importar lista');
    add.type = 'button';
    add.addEventListener('click', openDialog);
    tabsEl.appendChild(add);
  }

  async function loadDeck(id){
    try{
      const r = await store.get('deck:'+id, false);
      if(!r) return;
      currentDeck = JSON.parse(r.value);
      currentDeckId = id;
      pref.set('cardlist-current', id);
      renderTabs();
      renderDeck();
    }catch(e){ console.error(e); }
  }

  async function deleteDeck(id){
    try{
      await store.delete('deck:'+id, false);
      deckIndex = deckIndex.filter(d => d.id !== id);
      await store.set(STORAGE_KEY_INDEX, JSON.stringify(deckIndex), false);
      if(currentDeckId === id){
        currentDeck = null;
        currentDeckId = null;
      }
      renderTabs();
      renderDeck();
    }catch(e){ console.error(e); }
  }

  function emptyState(title, text, btnLabel, btnClass, onClick){
    const box = h('div', 'empty');
    const art = h('div', 'art');
    art.style.backgroundImage = 'url("' + scryfallImageUrl('Liliana of the Veil', 'art_crop') + '")';
    const body = h('div', 'body');
    body.append(h('div', 'title', title), h('div', null, text));
    const btn = h('button', 'btn' + (btnClass ? ' '+btnClass : ''), btnLabel);
    btn.type = 'button';
    btn.addEventListener('click', onClick);
    body.appendChild(btn);
    box.append(art, body);
    return box;
  }

  function charIndex(id){
    let n = 0;
    for(const ch of id) n = (n + ch.charCodeAt(0)) % CHARACTERS.length;
    return n;
  }

  // Estrutura do deck (hero + toolbar) só é recriada ao trocar de deck;
  // a busca não perde o foco porque só a lista abaixo é redesenhada.
  let statsEl = null, listEl = null;

  function renderDeck(){
    hidePreview();
    main.innerHTML = '';
    statsEl = listEl = null;
    if(!currentDeck){
      main.appendChild(emptyState('Nenhum deck carregado', 'Cole sua decklist para montar a checklist de compras.', 'Importar lista', '', openDialog));
      return;
    }

    const hero = h('section', 'hero');
    const left = h('div');
    left.style.minWidth = '0';
    const total = currentDeck.cards.reduce((s, c) => s + c.qty, 0);
    left.append(h('div', 'eyebrow', 'Deck ativo · ' + total + ' cartas'), h('h1', null, currentDeck.name));
    statsEl = h('div', 'stats');
    left.appendChild(statsEl);
    const art = h('div', 'art');
    art.style.backgroundImage = 'url("' + scryfallImageUrl(CHARACTERS[charIndex(currentDeck.id)], 'art_crop') + '")';
    hero.append(left, art);

    const bar = h('div', 'toolbar');
    const search = h('input', 'input');
    search.type = 'text';
    search.placeholder = 'buscar carta…';
    search.value = query;
    search.addEventListener('input', () => { query = search.value; renderGrid(); });
    bar.append(
      search,
      segmented('seg chips', [['all','Todas'],['pending','Pendentes'],['owned','Tenho']], () => filter, v => { filter = v; renderGrid(); }),
      segmented('seg', [['list','Lista'],['grid','Grade']], () => view, v => { view = v; pref.set('cardlist-view', v); renderGrid(); })
    );

    listEl = h('div');
    main.append(hero, bar, listEl);
    updateStats();
    renderGrid();
  }

  function segmented(cls, options, get, set){
    const wrap = h('div', cls);
    const sync = () => wrap.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === get()));
    for(const [v, label] of options){
      const b = h('button', null, label);
      b.type = 'button';
      b.dataset.v = v;
      b.addEventListener('click', () => { set(v); sync(); });
      wrap.appendChild(b);
    }
    sync();
    return wrap;
  }

  function updateStats(){
    if(!statsEl) return;
    const total = currentDeck.cards.reduce((s, c) => s + c.qty, 0);
    const owned = currentDeck.cards.filter(c => c.owned).reduce((s, c) => s + c.qty, 0);
    const pending = currentDeck.cards.filter(c => !c.owned).length;
    const pct = total === 0 ? 0 : Math.round(owned / total * 100);
    statsEl.innerHTML = '';
    for(const [value, label, accent] of [[owned, 'cartas que tenho'], [pending, 'pendentes'], [pct + '%', 'completo', true]]){
      const cell = h('div', accent ? 'accent' : null);
      cell.append(h('b', null, value), h('span', null, label));
      statsEl.appendChild(cell);
    }
  }

  let hoverTimer = null;
  const HOVER_DELAY = 550; // ms parado em cima antes do popup aparecer

  function renderGrid(){
    if(!listEl) return;
    hidePreview();
    listEl.innerHTML = '';
    const q = query.trim().toLowerCase();
    const list = currentDeck.cards
      .filter(c => !q || c.name.toLowerCase().includes(q))
      .filter(c => filter === 'all' || (filter === 'owned' && c.owned) || (filter === 'pending' && !c.owned));

    if(list.length === 0){
      const box = emptyState('Nada por aqui', 'Ajuste a busca ou o filtro.', 'Limpar filtros', 'outline', () => { query = ''; filter = 'all'; renderDeck(); });
      box.style.marginTop = '24px';
      listEl.appendChild(box);
      return;
    }

    const groups = new Map();
    for(const card of list){
      const cat = card.category || 'Outros';
      if(!groups.has(cat)) groups.set(cat, []);
      groups.get(cat).push(card);
    }
    const sortedCats = Array.from(groups.keys()).sort((a,b) => {
      const ia = CATEGORY_ORDER.indexOf(a), ib = CATEGORY_ORDER.indexOf(b);
      return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib);
    });

    for(const cat of sortedCats){
      const catCards = groups.get(cat);
      const catOwned = catCards.filter(c => c.owned).reduce((s,c)=>s+c.qty,0);
      const catTotal = catCards.reduce((s,c)=>s+c.qty,0);

      const head = h('div', 'cat-head');
      head.append(h('div', 't', cat), h('div', 'rule'), h('div', 'n', catOwned + ' / ' + catTotal));
      const box = h('div', view === 'list' ? 'rows' : 'tiles');
      for(const card of catCards) box.appendChild(view === 'list' ? buildCardRow(card) : buildCardTile(card));
      listEl.append(head, box);
    }
  }

  function buildCheck(card){
    const check = h('div', 'check' + (card.owned ? ' on' : ''));
    check.setAttribute('role', 'checkbox');
    check.setAttribute('aria-checked', String(!!card.owned));
    check.setAttribute('aria-label', card.name);
    check.tabIndex = 0;
    check.innerHTML = CHECK_SVG;
    const toggle = ev => { ev.stopPropagation(); toggleOwned(card); };
    check.addEventListener('click', toggle);
    check.addEventListener('keydown', ev => { if(ev.key === ' ' || ev.key === 'Enter'){ ev.preventDefault(); toggle(ev); } });
    return check;
  }

  function buildCardRow(card){
    const row = h('div', 'row' + (card.owned ? ' owned' : '') + (card.notFound ? ' not-found' : ''));
    const thumb = h('div', 'thumb');
    thumb.style.backgroundImage = 'url("' + scryfallImageUrl(card.name, 'art_crop') + '")';

    const catSelect = h('select', 'cat-select');
    catSelect.title = 'corrigir categoria';
    for(const c of CATEGORY_ORDER){
      const opt = h('option', null, c);
      opt.value = c;
      if(c === card.category) opt.selected = true;
      catSelect.appendChild(opt);
    }
    catSelect.addEventListener('change', () => {
      card.category = catSelect.value;
      saveCurrentDeck();
      renderGrid();
    });

    row.append(buildCheck(card), thumb, h('div', 'qty', '×' + card.qty), h('div', 'name', card.name), catSelect, h('div', 'pill', card.owned ? 'tenho' : 'pendente'));

    row.addEventListener('mouseenter', e => {
      clearTimeout(hoverTimer);
      movePreview(e);
      hoverTimer = setTimeout(() => showPreview(card.image), HOVER_DELAY);
    });
    row.addEventListener('mousemove', movePreview);
    row.addEventListener('mouseleave', () => {
      clearTimeout(hoverTimer);
      hidePreview();
    });
    return row;
  }

  function buildCardTile(card){
    const tile = h('div', 'tile' + (card.owned ? ' owned' : ''));
    const img = h('img');
    img.src = card.image;
    img.alt = card.name;
    img.loading = 'lazy';
    img.addEventListener('error', () => img.replaceWith(h('div', 'nf', 'carta não encontrada na Scryfall')));
    const foot = h('div', 'foot');
    foot.append(h('span', 'name', card.name), h('span', 'pill', card.owned ? 'tenho' : 'pendente'));
    tile.append(img, buildCheck(card), h('div', 'badge', '×' + card.qty), foot);
    return tile;
  }

  async function toggleOwned(card){
    card.owned = !card.owned;
    await saveCurrentDeck();
    renderGrid();
    updateStats();
  }

  function showPreview(src){
    if(!src) return;
    preview.classList.remove('notfound');
    previewImg.onerror = () => preview.classList.add('notfound');
    previewImg.onload = () => preview.classList.remove('notfound');
    previewImg.src = src;
    preview.classList.add('show');
  }
  function movePreview(e){
    const pad = 18;
    let x = e.clientX + pad;
    let y = e.clientY + pad;
    if(x + 260 > window.innerWidth) x = e.clientX - 260 - pad;
    if(y + 350 > window.innerHeight) y = window.innerHeight - 350 - 10;
    preview.style.left = x+'px';
    preview.style.top = y+'px';
  }
  function hidePreview(){
    clearTimeout(hoverTimer);
    preview.classList.remove('show');
  }

  el('importBtn').addEventListener('click', importDeck);
  el('cancelBtn').addEventListener('click', closeDialog);
  dialog.addEventListener('click', e => { if(e.target === dialog) closeDialog(); });
  document.addEventListener('keydown', e => { if(e.key === 'Escape' && !dialog.hidden) closeDialog(); });
  el('themeBtn').addEventListener('click', () => {
    theme = theme === 'dark' ? 'light' : 'dark';
    pref.set('cardlist-theme', theme);
    applyTheme();
  });

  // init
  (async function init(){
    applyTheme();
    deckIndex = await loadDeckIndex();
    renderTabs();
    const last = pref.get('cardlist-current', null);
    const first = deckIndex.find(d => d.id === last) || deckIndex[0];
    if(first) await loadDeck(first.id);
    else renderDeck();
  })();
})();
</script>
</body>
</html>
